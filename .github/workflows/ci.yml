name: Java CI
on:
  push:
    branches:
      - main
      - integration
  pull_request:
    branches:
      - main
      - integration
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Get source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        uses: mvn clean verify

